name: Android ARM64 Release

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "scripts/lib/**"
      - "assets/**"
      - "patches/**"
      - ".env.example"
      - ".github/workflows/arm64-release.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-release.apk
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          pnpm --version

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile --filter=@t3tools/mobile...

      - name: Configure public app settings
        run: cp .env.example .env

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Build and verify ARM64 APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -t "$apk"
          mapfile -t abis < <(unzip -Z1 "$apk" | sed -nE 's#^lib/([^/]+)/[^/]+\.so$#\1#p' | sort -u)
          if [ "${#abis[@]}" -ne 1 ] || [ "${abis[0]}" != "arm64-v8a" ]; then
            printf 'Expected only arm64-v8a native libraries, found: %s\n' "${abis[*]:-none}" >&2
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/arm64-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arm64-release.apk
          path: ${{ runner.temp }}/arm64-release.apk
          if-no-files-found: error
          retention-days: 14
